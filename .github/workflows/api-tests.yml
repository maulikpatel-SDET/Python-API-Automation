name: API Automation Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to run tests"
        required: true
        default: "qa"
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'qa' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show selected environment
        run: echo "Selected environment: $ENVIRONMENT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        env:
          APP_ENV: ${{ env.ENVIRONMENT }}
        run: |
          pytest -q -v --tb=short

      - name: Run smoke tests
        if: always()
        env:
          APP_ENV: ${{ env.ENVIRONMENT }}
        run: |
          pytest -q -m "smoke" -v --tb=short || true

      - name: Write summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: $GITHUB_REF" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
          echo "- Run Date: $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.ENVIRONMENT }}
          path: |
            .pytest_cache/
            __pycache__/
          retention-days: 7

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ API Tests executed on **${{ env.ENVIRONMENT }}** environment\n\n📊 Environment: \`${{ env.ENVIRONMENT }}\`\n🔗 Commit: ${{ github.sha }}\n⏱️ Run: ${{ github.run_id }}`
            })
```