```yaml
name: API Automation Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to run tests'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

jobs:
  api-tests:
    runs-on: ubuntu-latest
    
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'qa' }}
      PYTHONUNBUFFERED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Display selected environment
        run: |
          echo "=================================================="
          echo "Selected Environment: ${{ env.ENVIRONMENT }}"
          echo "=================================================="

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8 (optional)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run API tests - ${{ env.ENVIRONMENT }}
        env:
          APP_ENV: ${{ env.ENVIRONMENT }}
        run: |
          echo "Running tests for environment: ${{ env.ENVIRONMENT }}"
          pytest -q --tb=short -v

      - name: Run smoke tests only
        if: always()
        env:
          APP_ENV: ${{ env.ENVIRONMENT }}
        run: |
          pytest -q -m "smoke" -v --tb=short || true

      - name: Generate test summary
        if: always()
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Date**: $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.ENVIRONMENT }}
          path: |
            .pytest_cache/
            __pycache__/
          retention-days: 7

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ API Tests executed on **${{ env.ENVIRONMENT }}** environment\n\n📊 Environment: \`${{ env.ENVIRONMENT }}\`\n🔗 Commit: ${{ github.sha }}\n⏱️ Run: ${{ github.run_id }}`
            })
```